<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjaga Karang</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #010b18;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #0ea5e9;
            border-radius: 8px;
            overflow: hidden;
            background: #020617;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #020617, #091e3a);
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="960" height="540"></canvas>
    </div>
    <div class="info">Gunakan A/D atau Panah Kiri/Kanan untuk Gerak, Spasi untuk Menembak, P untuk Jeda.</div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
